<div>
    <h2>Settings</h2>
    <app-invite-member (memberInvited)="onMemberinvited()"></app-invite-member>
    <app-alert></app-alert>
    <div class="tab-menu">
        <div (click)="goToGeneralSetting()">
            <p class="tab-item">General Settings</p>
        </div>
        <div class="tab-item active">
            <p>Access Control</p>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-12">
            <!-- <app-card cardtitle="Membership list" cardclass="table-card"> -->
            <div class="table-card">
                <div class="card-body" style="padding: 0px;">
                    <div class="dataTable-top">
                            <h5>Members</h5>
                            <div class="actions">
                                <!-- <div class="dataTable-search d-flex align-items-center">
                                    <input id="table-complete-search" type="text" name="searchTerm" placeholder="Search..." class="form-control ng-untouched ng-pristine ng-valid">
                                </div> -->

                                <div class="add-member">
                                    <button class="btn btn-primary" (click)="open_invite_member()">
                                        <i class="fa fa-plus" aria-hidden="true"></i> 
                                        Invite Member
                                    </button>
                                </div>
                            </div>
                        </div>
                    <form novalidate="" class="dt-responsive ng-valid ng-dirty ng-touched">
                        <div class="table-responsive dt-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th scope="col" sortable="name">NAME</th>
                                        <th scope="col" sortable="mobile">EMAIL</th>
                                        <th scope="col" sortable="plan">ROLE</th>
                                        <th scope="col" sortable="action" class="text-center">ACTION</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let member of project[0].members">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div class="btn btn-primary">
                                                    {{usersService.getInitials(member.user_name)}}
                                                </div>
                                                <div class="flex-grow-1 ms-3">
                                                    <span class="coded-mtext">{{member.user_name}}</span>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <span class="coded-mtext">{{member.email}}</span>
                                        </td>
                                        <td>
                                            <span class="badge badge-sm text-bg-success">{{member.role}}</span>
                                        </td>
                                        <td class="text-center">
                                            <ul class="list-inline me-auto mb-0">

                                                </li> -->
                                                <li class="list-inline-item align-bottom">
                                                    <a href="javascript:" ngbtooltip="Edit" class="avatar avatar-xs btn-link-primary">
                                                        <i anticon="" type="edit" theme="outline" class="f-16 text-primary d-flex">
                                                            <svg viewBox="64 64 896 896" focusable="false" fill="currentColor" width="1em" height="1em">
                                                                <path d="M257.7 752c2 0 4-.2 6-.5L431.9 722c2-.4 3.9-1.3 5.3-2.8l423.9-423.9a9.96 9.96 0 000-14.1L694.9 114.9c-1.9-1.9-4.4-2.9-7.1-2.9s-5.2 1-7.1 2.9L256.8 538.8c-1.5 1.5-2.4 3.3-2.8 5.3l-29.5 168.2a33.5 33.5 0 009.4 29.8c6.6 6.4 14.9 9.9 23.8 9.9zm67.4-174.4L687.8 215l73.3 73.3-362.7 362.6-88.9 15.7 15.6-89zM880 836H144c-17.7 0-32 14.3-32 32v36c0 4.4 3.6 8 8 8h784c4.4 0 8-3.6 8-8v-36c0-17.7-14.3-32-32-32z">

                                                        </i>

                                            </ul>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
